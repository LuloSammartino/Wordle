services:
  - type: web
    name: wordle-fbkx
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: JWT_SECRET_KEY
        generateValue: true

  - type: web
    name: wordle-front
    env: static
    rootDir: frontend/client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
